version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: transito-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-transito_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password_2026}
      POSTGRES_DB: ${DB_NAME:-transito_municipal_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transito_admin} -d ${DB_NAME:-transito_municipal_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transito-cache-prod
    restart: always
    volumes:
      - redis_prod_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transito-api-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-transito_admin}:${DB_PASSWORD:-secure_prod_password_2026}@postgres:5432/${DB_NAME:-transito_municipal_prod}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-prod_jwt_supersecret_key_2026}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transito-web-prod
    restart: always
    environment:
      VITE_API_URL: /api/v1

  nginx:
    image: nginx:alpine
    container_name: transito-gateway-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_prod_data:
  redis_prod_data:
